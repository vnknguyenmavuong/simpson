// ============ HÀM RENDER ============
let state = { answered: 0, correct: 0, wrong: 0 };

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  let qIndex = 1;

  for (const sectionKey in quizData) {
    const section = quizData[sectionKey];
    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';
    sectionDiv.innerHTML = `
      <div class="section-title">
        ${section.title}
        <span class="badge">${section.badge}</span>
      </div>
    `;

    section.questions.forEach((qData, qIdx) => {
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `q-${sectionKey}-${qIdx}`;

      let optionsHtml = '';
      const letters = ['A', 'B', 'C', 'D'];
      qData.options.forEach((opt, oIdx) => {
        optionsHtml += `
          <div class="option" data-section="${sectionKey}" data-q="${qIdx}" data-o="${oIdx}">
            <span class="letter">${letters[oIdx]}</span>
            <span class="text">${opt}</span>
          </div>
        `;
      });

      card.innerHTML = `
        <div>
          <span class="q-number">${qIndex}</span>
          <div class="q-text">${qData.q}</div>
        </div>
        <div class="options">${optionsHtml}</div>
        <div class="explanation" id="exp-${sectionKey}-${qIdx}">
          <div class="correct-reason"><strong>💡 Đáp án đúng:</strong> ${letters[qData.correct]}</div>
          <div class="wrong-reason"><strong>📖 Giải thích:</strong> ${qData.explanation}</div>
        </div>
      `;
      sectionDiv.appendChild(card);
      qIndex++;
    });

    container.appendChild(sectionDiv);
  }

  // Gắn sự kiện
  document.querySelectorAll('.option').forEach(opt => {
    opt.addEventListener('click', handleAnswer);
  });

  // Render MathJax
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise();
  }
}

function handleAnswer(e) {
  const option = e.currentTarget;
  if (option.classList.contains('disabled')) return;

  const sectionKey = option.dataset.section;
  const qIdx = parseInt(option.dataset.q);
  const oIdx = parseInt(option.dataset.o);
  const qData = quizData[sectionKey].questions[qIdx];
  const card = document.getElementById(`q-${sectionKey}-${qIdx}`);
  const allOptions = card.querySelectorAll('.option');
  const explanation = document.getElementById(`exp-${sectionKey}-${qIdx}`);

  // Vô hiệu hóa tất cả lựa chọn
  allOptions.forEach(o => o.classList.add('disabled'));

  // Đánh dấu đúng/sai
  if (oIdx === qData.correct) {
    option.classList.add('correct');
    card.classList.add('answered-correct');
    state.correct++;
  } else {
    option.classList.add('wrong');
    card.classList.add('answered-wrong');
    // Hiển thị đáp án đúng
    allOptions[qData.correct].classList.add('show-correct');
    state.wrong++;
  }
  state.answered++;

  // Hiện giải thích
  explanation.classList.add('show');

  // Cập nhật thống kê
  updateStats();

  // Re-render MathJax cho phần giải thích
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([explanation]);
  }
}

function updateStats() {
  document.getElementById('answered').textContent = state.answered;
  document.getElementById('correctCount').textContent = state.correct;
  document.getElementById('wrongCount').textContent = state.wrong;
}

function resetQuiz() {
  state = { answered: 0, correct: 0, wrong: 0 };
  updateStats();
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Khởi động
renderQuiz();
</script>
